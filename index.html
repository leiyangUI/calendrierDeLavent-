<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff2d8" />
  <title>Un flocon par jour</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:#fff2d8;color:#493b3b;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.top{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(16px,calc((100vw - 760px)/2));background:#fffdf8;border-bottom:1px solid #eadbc7}.brand{font-weight:750}.switch{display:flex;gap:4px;padding:4px;border:1px solid #eadbc7;border-radius:999px;background:#fff2d8}.switch button{border:0;border-radius:999px;padding:9px 14px;background:transparent;color:#817575;font:inherit;font-weight:700;cursor:pointer}.switch button[aria-pressed="true"]{background:#fff;box-shadow:0 2px 8px #493b3b1a;color:#c92f42}.switch button:focus-visible{outline:3px solid #493b3b;outline-offset:2px}iframe{display:block;width:100%;height:calc(100dvh - 64px);border:0;background:#fff2d8}@media(max-width:420px){.top{padding-inline:12px}.switch button{padding:8px 10px;font-size:13px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">❄ Un flocon par jour</div>
    <div class="switch" role="group" aria-label="Choisir une version">
      <button type="button" data-mode="boy" aria-pressed="true">Garçon</button>
      <button type="button" data-mode="girl" aria-pressed="false">Fille</button>
    </div>
  </header>
  <iframe id="game" src="flacon/Un%20flocon%20par%20jour.html" title="Jeu du flocon quotidien"></iframe>
  <script>
    const frame = document.querySelector('#game');
    const buttons = [...document.querySelectorAll('[data-mode]')];
    let mode = 'boy';
    function paint() {
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      try {
        const root = frame.contentDocument.documentElement;
        if (mode === 'girl') {
          root.dataset.theme = 'light';
          Object.assign(root.style, {'--bg':'#fff2d8','--card':'#fffdf8','--ink':'#493b3b','--muted':'#817575','--line':'#eadbc7','--acc':'#f04452','--on':'#fff','--fk':'#c92f42'});
        } else {
          root.dataset.theme = 'light';
          ['--bg','--card','--ink','--muted','--line','--acc','--on','--fk'].forEach(name => root.style.removeProperty(name));
        }
      } catch (_) {}
    }
    buttons.forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; paint(); }));
    frame.addEventListener('load', paint);
  </script>
</body>
</html>
