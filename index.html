<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff2d8" />
  <title>Un flocon par jour</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:transparent;color:#12263f;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--switch-text:#566b85;--switch-active:#1f4f86;--focus:#2563a8}.top{height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px max(12px,calc((100vw - 420px)/2));background:transparent}.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px;white-space:nowrap}.brand-mark{font-size:24px;line-height:1}.switch{display:flex;gap:2px;padding:0;border:0;border-radius:0;background:transparent}.switch button{border:0;border-radius:999px;padding:7px 12px;background:transparent;color:var(--switch-text);font:inherit;font-size:13px;font-weight:750;cursor:pointer}.switch button[aria-pressed="true"]{background:rgba(255,255,255,.74);box-shadow:0 1px 5px #12263f18;color:var(--switch-active)}.switch button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}body[data-mode="girl"]{color:#493b3b;--switch-text:#817575;--switch-active:#c92f42;--focus:#c92f42}.switch button[aria-pressed="true"]{color:var(--switch-active)}iframe{display:block;width:100%;height:calc(100dvh - 50px);border:0;background:#eef4fb}body[data-mode="girl"] iframe{background:#fff2d8}@media(max-width:420px){.top{padding-inline:10px}.brand{font-size:14px}.brand-mark{font-size:22px}.switch button{padding:7px 9px;font-size:12px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true">❄</span> Un flocon par jour</div>
    <div class="switch" role="group" aria-label="Choisir une version">
      <button type="button" data-mode="boy" aria-pressed="true">Garçon</button>
      <button type="button" data-mode="girl" aria-pressed="false">Fille</button>
    </div>
  </header>
  <iframe id="game" src="flacon/Un%20flocon%20par%20jour.html" title="Jeu du flocon quotidien"></iframe>
  <script>
    const frame = document.querySelector('#game');
    const buttons = [...document.querySelectorAll('[data-mode]')];
    let mode = localStorage.getItem('flacon-version') || 'boy';
    function paint() {
      document.body.dataset.mode = mode;
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      frame.contentWindow.postMessage({type:'flacon-version', mode}, '*');
    }
    buttons.forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; localStorage.setItem('flacon-version', mode); paint(); }));
    frame.addEventListener('load', paint);
  </script>
</body>
</html>
