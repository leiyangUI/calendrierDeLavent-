name: Deploy calendrier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers publics
        run: |
          mkdir -p _site
          cp index.html styles.css app.js christmas-ball.svg gift-icon.svg lock-open-green.svg lock-closed-red.svg _site/
          touch _site/.nojekyll

      - name: Déposer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
